name: Desktop Build

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-build.yml"
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            command: package:mac
          - os: windows-2022
            target: win
            command: package:win
          - os: ubuntu-22.04
            target: linux
            command: package:linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@10.26.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm --filter @loomic/desktop run ${{ matrix.command }}
